[project]
name = "agent-phone-service"
version = "0.1.0"
description = "Agent-independent phone-calling service with HTTP and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "sse-starlette>=2.1.3",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
# The official mcp package is optional at runtime; the service keeps a stub fallback.
# Install it if you want to expose the native MCP server bindings.
mcp = ["mcp>=1.6.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
